notes: |
  Aggregates IT roles directly from 21,000 employers' own career pages
  (Greenhouse, Lever, Ashby, Workable, and others) across Europe.
  No public API; listings are served as HTML only. The search page at
  /jobs supports country, remote, visa-sponsorship, and English-speaking-team
  filters as URL query parameters.

  Updated every hour; stale roles are removed promptly. All listings link
  directly to the employer's own apply page (no apply-on-site flow).
  Roughly 28,000 active IT roles as of Nov 2026. English-language site
  regardless of job location. No authentication required to browse.

